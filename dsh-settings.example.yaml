# ~/.dsh/settings.yaml の雛形。<MAC_IP> を Mac mini の Tailscale IP（外出先）か LAN IP（自宅）に置き換える。
# Mac mini 上で使う場合は 127.0.0.1。apiKeyEnv の環境変数は非空なら何でもよい（Ollama は無視、MTPLX は --api-key と一致させる）。
#
# 同居の制約（32GB機）: Ollama のモデル（22〜24GB）と Ornith（MTPLX、約24G予算）は同時に載らない。
#   - Ornith を使う → Mac 側で serve-ornith.sh start（Ollama のモデルを自動アンロード）
#   - Ollama を使う → serve-ornith.sh stop してから。Ollama は最初のリクエストで自動ロード（初回 20〜60 秒）
#   - Ollama は OLLAMA_MAX_LOADED_MODELS=1 / OLLAMA_KEEP_ALIVE=30m（別モデルの会話を始めると前のモデルは自動で落ちる、30分放置でアンロード）
#   - SemIf 分類器（:8090、約2.5GB）は Ollama GGUF・Ornith どちらとも同居実績あり
#
# 切り替えは agent-default-model を書き換える（Web UI にモデル設定タブがあればそちらでも可）。
llm-pi-ai:
  providers:
    ornith:
      apiKeyEnv: ORNITH_API_KEY
      api: openai-completions
      baseURL: http://<MAC_IP>:8082/v1
      models:
        - id: ornith                       # Ornith-1.5 MTPLX。dsh 向けで最速（cmdeval 257.8秒）
    ollama:
      apiKeyEnv: OLLAMA_API_KEY
      api: openai-completions
      baseURL: http://<MAC_IP>:11434/v1
      defaultInput: [text, image]         # Qwen3.6 は vision 同梱。dsh は既定 text のみなので画像添付を許可する（Ornith 側には付けない）
      models:
        - id: qwen3.6:35b-a3b-mtp-q4_K_M-32k  # MTP投機デコード版GGUF、num_ctx 32768。thinking/コードで37〜41 tok/s(Ornith級)
        - id: qwen3.6:35b-a3b-mtp-q4_K_M      # 同上、既定ctx
        - id: qwen3.6:35b-mlx-32k             # Claude Code の決定版。dsh 経由 約30 tok/s
      # 2026-09-22 に内蔵から退避（ollama_restore.py で戻せる）: qwen3.6:35b-a3b-q4_K_M-32k、gemma4:26b-a4b-it-mtp-q4_K_M
agent-default-model:
  provider: ornith
  model: ornith
